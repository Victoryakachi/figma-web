<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In | Exclusive</title>
  <link rel="stylesheet" href="account.css">
</head>
<body>
  <header class="account-header">
    <a class="account-brand" href="../index.html">Exclusive</a>
    <p>New to Exclusive? <a href="../figmasign.html">Create an account</a></p>
  </header>

  <main class="account-main">
    <section class="account-image">
      <img src="media/loginandsignuppic.jpg" alt="Phone, shopping cart, and shopping bags">
    </section>

    <section class="account-form-wrap">
      <h2>Log in to Exclusive</h2>
      <p class="account-intro">Enter your details below</p>
      <form class="account-form" data-account-form>
        <label class="account-field">
          <span class="visually-hidden">Email or phone number</span>
          <input type="text" name="email" autocomplete="username" placeholder="Email or Phone Number" required>
        </label>
        <label class="account-field">
          <span class="visually-hidden">Password</span>
          <input type="password" name="password" autocomplete="current-password" placeholder="Password" required>
        </label>
        <div class="account-login-actions">
          <button class="account-submit" type="submit">Log In</button>
          <a href="mailto:exclusive@gmail.com?subject=Password%20reset%20request">Forget Password?</a>
        </div>
        <p class="account-status" data-account-status></p>
      </form>
    </section>
  </main>

  <footer class="account-footer">
    <p>© Copyright Exclusive 2026. All rights reserved.</p>
  </footer>
  <script src="account.js"></script>
</body>
</html>
